<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ski Run</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #dfe9f3;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      #wip {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        padding: 2px 8px;
        text-align: center;
        font-size: 12px;
        background: #ffe9a8;
        color: #5a4300;
      }
      #hud {
        position: fixed;
        top: 28px;
        left: 12px;
        z-index: 5;
        color: #12263f;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
      }
      #hud-time {
        font-size: 32px;
        font-weight: 700;
      }
      #hud-seed {
        position: fixed;
        right: 12px;
        bottom: 8px;
        font-size: 12px;
        color: #3d5573;
      }
      #hud-message {
        position: fixed;
        top: 38%;
        width: 100%;
        text-align: center;
        font-size: 44px;
        font-weight: 700;
        color: #12263f;
        text-shadow: 0 2px 0 rgba(255, 255, 255, 0.8);
        pointer-events: none;
      }
      #help {
        position: fixed;
        left: 12px;
        bottom: 8px;
        font-size: 12px;
        color: #3d5573;
      }
    </style>
  </head>
  <body>
    <div id="wip">Work in progress — a toy project</div>
    <div id="scene"></div>
    <div id="hud">
      <div id="hud-time">0:00.00</div>
      <div id="hud-speed"></div>
      <div id="hud-gates"></div>
      <div id="hud-penalty"></div>
    </div>
    <div id="hud-message"></div>
    <div id="hud-seed"></div>
    <div id="help">
      Arrows / A D steer, Down / S tuck, Space brake, R restart. Add ?seed=N for another course.
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
